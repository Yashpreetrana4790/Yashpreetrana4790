# Contribution snake — powered by dahan8473/snake-and-commits
# Real Snake AI over your GitHub contribution graph → animated SVG on the `output` branch
name: Generate contribution snake

on:
  schedule:
    # Twice a day (UTC)
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate light snake (green + frame)
        uses: dahan8473/snake-and-commits@v1
        with:
          github_user: ${{ github.repository_owner }}
          output: dist/snake-light.svg
          theme: green
          frame: "true"
          counter: "true"

      - name: Generate dark snake (matrix + frame)
        uses: dahan8473/snake-and-commits@v1
        with:
          github_user: ${{ github.repository_owner }}
          output: dist/snake-dark.svg
          theme: matrix
          frame: "true"
          counter: "true"

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
